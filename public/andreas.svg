      <path d="M10 -38 q7 7 14 0" stroke="#6B3B1E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M-9 -10 q9 8 18 0" stroke="#B5765A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
