      <path d="M-13 8 h26 v26 h-26 z" fill="#E3B694"/>
      <ellipse cx="0" cy="-30" rx="37" ry="43" fill="#F3CFB2"/>
      <!-- hair -->
      <path d="M-38 -34 C-40 -80 -18 -90 0 -90 C20 -90 40 -78 38 -34 C34 -58 18 -66 0 -66 C-18 -66 -32 -58 -38 -34 Z" fill="#8A6234"/>
      <path d="M-38 -32 q-16 46 -8 84 q-18 -38 -8 -86 z" fill="#8A6234"/>
      <path d="M38 -32 q16 46 8 84 q18 -38 8 -86 z" fill="#8A6234"/>
      <path d="M-34 -50 q16 -18 40 -14 q-24 2 -36 18 z" fill="#A07845"/>
