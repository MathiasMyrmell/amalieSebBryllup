      <g transform="translate(30,-62)">
        <circle cx="0" cy="0" r="8" fill="#E8A33D"/>
        <circle cx="-11" cy="6" r="6" fill="#F6D9DF"/>
        <circle cx="8" cy="10" r="5" fill="#D98494"/>
        <path d="M-16 -2 q-8 -5 -8 -12 q9 2 12 9 z" fill="#8FA57E"/>
      </g>
      <!-- features -->
      <path d="M-24 -38 q7 7 14 0" stroke="#5B3A2A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M10 -38 q7 7 14 0" stroke="#5B3A2A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M-9 -10 q9 8 18 0" stroke="#B9646A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <!-- earrings -->
      <circle cx="-33" cy="-18" r="3" fill="#C9A227"/>
      <circle cx="33" cy="-18" r="3" fill="#C9A227"/>
    </g>
