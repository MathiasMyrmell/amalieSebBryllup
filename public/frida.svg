      <path d="M-104 112 Q-92 46 -34 30 L34 30 Q92 46 104 112 Z" fill="#D46A7E"/>
      <path d="M-22 28 Q0 52 22 28 Q0 44 -22 28 Z" fill="#C25A73"/>
